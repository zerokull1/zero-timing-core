[package]
name = "zero_project"
version = "0.1.0"
edition = "2021"

[dependencies]

[lib]
name = "zero_core_lib"
path = "src/lib.rs"
test = false

[[bin]]
name = "zero_project"
path = "src/main.rs"
test = false

[[bin]]
name = "core_self_test"
path = "src/bin/core_self_test.rs"
test = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
